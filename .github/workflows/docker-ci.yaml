name: Practice workflow
on:
  push:
    branches:
      ["main"]
  workflow_dispatch:

jobs:
  build-and-greet:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Say Hello
      run: echo "Hello World"

    - name: Display environment details
      run: |
        echo "Triggered by event: ${github.event_name}"
        echo "Branch : ${github.ref}"
        echo "pwd:" 
        pwd
        
      


