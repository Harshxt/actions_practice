  name: Docker Image Build

  on:
    push:
      branches: ["main"]
    pull_request:
      branches: ["main"]

  jobs:
    build:
      runs-on: ubuntu-latest
      steps:
        - name: Checkout code
          uses: actions/checkout@v4

        - name: DB setup
          run: |
            docker pull postgres:latest
            docker run -d \
            --name local-postgres \
            -e POSTGRES_USER=postgres \
            -e POSTGRES_PASSWORD=admin \
            -e POSTGRES_DB=test \
            -p 5432:5432 \
            postgres:latest

        - name: Docker Image build
          run: |
            docker build -t my-app:latest .
        - name: Verify build
          run: |
            docker images
            docker run --rm my-app:latest echo "Container runs successfully! Build Verified"
        - name: Verify build
          run: |
            docker images
            docker run --rm \
            --add-host=host.docker.internal:host-gateway \
            my-app:latest
            
            
  
