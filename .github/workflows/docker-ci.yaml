name: Docker Image Build

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  build:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:latest
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: admin
          POSTGRES_DB: test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # Step 1: Run tests against the Postgres service (Optional, edit to match Maven/Gradle)
      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Run Tests
        env:
          SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:5432/test
          SPRING_DATASOURCE_USERNAME: postgres
          SPRING_DATASOURCE_PASSWORD: admin
        run: |
          if [ -f "gradlew" ]; then
            ./gradlew test
          elif [ -f "mvnw" ]; then
            ./mvnw test
          else
            echo "No build tool wrapper found, skipping test step."
          fi

      # Step 2: Build Docker Image (Dockerfile must skip tests inside container)
      - name: Docker Image build
        run: |
          docker build -t my-app:latest .

      # Step 3: Verify build
      - name: Verify build
        run: |
          docker images
          docker run --rm my-app:latest echo "Container runs successfully! Build Verified"
